apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-css-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: html-css-app

  template:
    metadata:
      labels:
        app: html-css-app

    spec:
      containers:
        - name: nginx
          image: kathavathshiva/html-css-app:latest

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
